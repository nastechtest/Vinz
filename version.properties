# Vinz — single source of truth for the app version.
#
# versionName  Semantic version shown in Settings -> About and used as the Git tag "v<versionName>".
#              A stable release is published from a commit whose versionName matches the tag exactly.
# versionCode  Android's monotonically increasing integer. MUST be greater than the versionCode of the
#              previous stable release (the stable-release workflow enforces this), otherwise Android
#              refuses the update.
#
# Release preparation = a PR that edits these two values. Nothing else in the pipeline rewrites them;
# CI only *stamps* extra build labels (e.g. 1.7.7.1-main.15) onto development builds via -PciVersionName.
versionName=1.7.7.1
versionCode=47
