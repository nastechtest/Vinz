name: Deploy Cloudflare staging API

on:
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: "Type deploy-staging to deploy the staging Worker"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vinz-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: ${{ inputs.confirm_staging_deploy == 'deploy-staging' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run Worker tests before deployment
        working-directory: platform/cloudflare
        run: |
          set -euo pipefail
          node --check vinz-api.js
          npm test

      - name: Deploy only the staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.VINZ_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VINZ_SUPABASE_PUBLISHABLE_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          node <<'NODE'
          const required = [
            "CLOUDFLARE_API_TOKEN",
            "CLOUDFLARE_ACCOUNT_ID",
            "SUPABASE_URL",
            "SUPABASE_PUBLISHABLE_KEY",
            "POSTHOG_HOST",
          ];
          const missing = required.filter((key) => !process.env[key]);
          if (missing.length) {
            console.error("Missing GitHub secrets/variables:", missing.join(", "));
            process.exit(1);
          }

          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const metadata = {
            main_module: "worker.js",
            compatibility_date: "2026-11-07",
            workers_dev: true,
            preview_urls: false,
            bindings: [
              { type: "r2_bucket", name: "BACKUPS_BUCKET", bucket_name: "vinz-backups" },
              { type: "kv_namespace", name: "CATALOG_CACHE", namespace_id: "3e172dca32ca48e9be8d09b30f6a2a96" },
              { type: "plain_text", name: "SUPABASE_URL", text: process.env.SUPABASE_URL },
              { type: "plain_text", name: "SUPABASE_PUBLISHABLE_KEY", text: process.env.SUPABASE_PUBLISHABLE_KEY },
              { type: "plain_text", name: "POSTHOG_HOST", text: process.env.POSTHOG_HOST },
            ],
            observability: {
              enabled: true,
              head_sampling_rate: 1,
              redact_query_string: true,
              logs: { enabled: true, head_sampling_rate: 1, persist: true, invocation_logs: true },
              traces: { enabled: true, head_sampling_rate: 0.1, persist: true },
            },
          };

          (async () => {
            const source = await (await import("node:fs/promises")).readFile("platform/cloudflare/vinz-api.js", "utf8");
            const form = new FormData();
            form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
            form.append("worker.js", new Blob([source], { type: "application/javascript+module" }), "worker.js");
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/vinz-api-staging`,
              {
                method: "PUT",
                headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
                body: form,
                signal: AbortSignal.timeout(60000),
              },
            );
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success !== true) {
              console.error("Cloudflare staging deployment failed:", response.status,
                (result.errors || []).map((e) => e.code).join(", "));
              process.exit(1);
            }
            console.log("Deployed vinz-api-staging successfully. Production Worker was not modified.");
          })().catch((error) => {
            console.error("Deployment failed:", error.name || "unknown_error");
            process.exitCode = 1;
          });
          NODE
