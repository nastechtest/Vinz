name: Deploy Cloudflare staging API

on:
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: "Type deploy-staging to deploy the staging Worker"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vinz-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: ${{ inputs.confirm_staging_deploy == 'deploy-staging' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run Worker tests before deployment
        working-directory: platform/cloudflare
        run: |
          set -euo pipefail
          node --check vinz-api.js
          npm test

      - name: Deploy only the staging Worker from wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
        run: |
          node <<'NODE'
          const fs = require("node:fs/promises");
          const path = require("node:path");
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const posthogProjectKey = process.env.POSTHOG_PROJECT_KEY;
          if (!posthogProjectKey) {
            console.error("Missing POSTHOG_PROJECT_KEY repository variable for Worker error telemetry.");
            process.exit(1);
          }
          if (!token || !account) {
            console.error("Missing CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable.");
            process.exit(1);
          }

          (async () => {
            const config = JSON.parse(await fs.readFile("platform/cloudflare/wrangler.jsonc", "utf8"));
            if (config.name !== "staging" || config.workers_dev !== true) {
              throw new Error("Refusing deployment: Wrangler config is not the staging Worker.");
            }
            config.vars = { ...(config.vars || {}), POSTHOG_PROJECT_KEY: posthogProjectKey };
            const bindings = [
              ...(config.kv_namespaces || []).map((item) => ({
                type: "kv_namespace", name: item.binding, namespace_id: item.id,
              })),
              ...(config.r2_buckets || []).map((item) => ({
                type: "r2_bucket", name: item.binding, bucket_name: item.bucket_name,
              })),
              ...Object.entries(config.vars || {}).map(([name, text]) => ({
                type: "plain_text", name, text,
              })),
            ];
            const metadata = {
              main_module: path.basename(config.main),
              compatibility_date: config.compatibility_date,
              workers_dev: config.workers_dev,
              preview_urls: config.preview_urls === true,
              bindings,
              observability: config.observability,
            };
            const source = await fs.readFile(path.join("platform/cloudflare", config.main), "utf8");
            const form = new FormData();
            form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
            form.append(path.basename(config.main), new Blob([source], { type: "application/javascript+module" }), path.basename(config.main));
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${config.name}`,
              {
                method: "PUT",
                headers: { authorization: `Bearer ${token}` },
                body: form,
                signal: AbortSignal.timeout(60000),
              },
            );
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success !== true) {
              console.error("Cloudflare staging deployment failed:", response.status,
                (result.errors || []).map((error) => error.code).join(", "));
              process.exit(1);
            }
            console.log(`Deployed ${config.name} using wrangler.jsonc. Production Worker was not modified.`);
          })().catch((error) => {
            console.error("Deployment failed:", error.name || "unknown_error");
            process.exitCode = 1;
          });
          NODE
