name: Connected provider health

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

concurrency:
  group: provider-health
  cancel-in-progress: true

jobs:
  verify-provider-access:
    name: Verify configured provider credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check provider access without exposing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const results = [];
          async function check(name, configured, url, init = {}) {
            if (!configured) {
              results.push({ name, status: "SKIPPED", detail: "credentials or project variables not configured" });
              return;
            }
            try {
              const response = await fetch(url, { ...init, signal: AbortSignal.timeout(15000) });
              if (!response.ok) {
                results.push({ name, status: "FAILED", detail: `HTTP ${response.status}` });
                return;
              }
              results.push({ name, status: "OK", detail: `HTTP ${response.status}` });
            } catch (error) {
              results.push({ name, status: "FAILED", detail: error.name || "network_error" });
            }
          }
          const bearer = (token) => ({ authorization: `Bearer ${token}` });
          (async () => {
            const cf = process.env.CLOUDFLARE_API_TOKEN;
            await check("Cloudflare", !!cf,
              "https://api.cloudflare.com/client/v4/user/tokens/verify",
              { headers: bearer(cf) });

            const sb = process.env.SUPABASE_ACCESS_TOKEN;
            const ref = process.env.SUPABASE_PROJECT_REF;
            await check("Supabase", !!(sb && ref),
              `https://api.supabase.com/v1/projects/${encodeURIComponent(ref || "")}`,
              { headers: bearer(sb) });

            const linear = process.env.LINEAR_API_KEY;
            await check("Linear", !!linear, "https://api.linear.app/graphql", {
              method: "POST",
              headers: { ...bearer(linear), "content-type": "application/json" },
              body: JSON.stringify({ query: "query ProviderHealth { viewer { id name } }" }),
            });

            const posthog = process.env.POSTHOG_PERSONAL_API_KEY;
            const host = (process.env.POSTHOG_HOST || "https://us.i.posthog.com").replace(/[/]+$/, "");
            await check("PostHog", !!posthog, `${host}/api/projects/`, {
              headers: bearer(posthog),
            });

            for (const result of results) {
              console.log(`${result.status.padEnd(7)} ${result.name}: ${result.detail}`);
            }
            const summary = [
              "## Connected provider health",
              "",
              "| Provider | Result | Detail |",
              "|---|---|---|",
              ...results.map((r) => `| ${r.name} | ${r.status} | ${r.detail} |`),
              "",
              "Skipped checks mean the corresponding GitHub secret or repository variable is not configured.",
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
            if (results.some((r) => r.status === "FAILED")) process.exitCode = 1;
          })().catch((error) => {
            console.error("Provider health runner failed:", error.name || "unknown_error");
            process.exitCode = 1;
          });
          NODE
