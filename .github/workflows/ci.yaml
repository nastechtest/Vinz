name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  android:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$sdkmanager" ]; then echo 'Android SDK manager not found' >&2; exit 1; fi
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-37' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile debug app and benchmark module
        run: ./gradlew :app:assembleDebug :baselineprofile:assemble --no-daemon
      - name: Run deterministic JVM tests
        shell: bash
        run: |
          mapfile -t sources < <(find app/src/test/java -type f -name '*Test.kt' | sort)
          args=()
          for source in "${sources[@]}"; do
            case "$source" in
              *Live*|*ApiTest.kt) continue ;;
            esac
            class_name="${source#app/src/test/java/}"
            class_name="${class_name%.kt}"
            class_name="${class_name//\//.}"
            args+=(--tests "$class_name")
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo 'No deterministic JVM test classes were selected.' >&2
            exit 1
          fi
          ./gradlew :app:testDebugUnitTest "${args[@]}" --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vinz-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
