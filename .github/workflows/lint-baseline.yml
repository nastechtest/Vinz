# One-off helper: regenerates app/lint-baseline.xml on a runner that has the Android SDK.
# Run it from the branch that needs the baseline, download the artifact, commit the file, delete this workflow.
name: Generate lint baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Update lint baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci/install-android-sdk.sh
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Generate baseline
        run: ./gradlew :app:updateLintBaseline --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-baseline
          path: app/lint-baseline.xml
          if-no-files-found: error
