name: Branding timing bootstrap

on:
  push:
    branches:
      - feat/branding-timing-evidence
    paths:
      - .github/workflows/branding-timing-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: branding-timing-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-approved-lyrics-only:
    runs-on: ubuntu-latest
    steps:
      - name: Apply verified Lyrics.kt patch and remove helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          expected_tip = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          lyrics_path = "app/src/main/java/com/vinz/music/data/lyrics/Lyrics.kt"
          helper_path = ".github/workflows/branding-timing-bootstrap.yml"
          expected_original_sha256 = "013229a6bb8000cb08e700632c5aeb04a3b0f65e4a93b1cccdda59678ebae00a"
          expected_target_sha256 = "4091f15c75455ed739e5503e4f5ad551ff104c2613d168a5b92542aa58077474"
          branch = "feat/branding-timing-evidence"
          api = "https://api.github.com"

          def request(method, path, body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "X-GitHub-Api-Version": "2022-11-28",
                      **({"Content-Type": "application/json"} if data is not None else {}),
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          try:
              ref = request("GET", f"/repos/{repo}/git/ref/heads/{branch}")
              if ref.get("object", {}).get("sha") != expected_tip:
                  raise RuntimeError("branch tip changed")

              commit = request("GET", f"/repos/{repo}/git/commits/{expected_tip}")
              base_tree = commit.get("tree", {}).get("sha")
              if not base_tree:
                  raise RuntimeError("missing base tree")

              contents = request(
                  "GET", f"/repos/{repo}/contents/{lyrics_path}?ref={expected_tip}"
              )
              original = base64.b64decode(contents["content"].replace("\n", ""))
              if hashlib.sha256(original).hexdigest() != expected_original_sha256:
                  raise RuntimeError("unexpected source")
              text = original.decode("utf-8")

              replacements = (
                  (
                      "    val background: List<LyricWord> = emptyList(),\n",
                      "    val background: List<LyricWord> = emptyList(),\n"
                      "    /** Evidence for branding eligibility; ordinary gap presentation does not imply vocal silence. */\n"
                      "    val gapProvenance: GapProvenance = GapProvenance.UNKNOWN,\n",
                  ),
                  (
                      "            LyricLine(t, s, end, isGap = s.isBlank())\n",
                      "            LyricLine(t, s, end, isGap = s.isBlank(),\n"
                      "                gapProvenance = if (s.isBlank()) GapProvenance.LRC_BLANK else GapProvenance.UNKNOWN)\n",
                  ),
                  (
                      "    return if (first.timeMs > 3000 && firstOrNull()?.isGap != true) listOf(LyricLine(0, \"\", first.timeMs, isGap = true)) + this else this\n",
                      "    return if (first.timeMs > 3000 && firstOrNull()?.isGap != true) listOf(LyricLine(0, \"\", first.timeMs, isGap = true, gapProvenance = GapProvenance.INFERRED_INTRO)) + this else this\n",
                  ),
                  (
                      "        if (i > 0 && l.timeMs - prevEnd > 6000) withGaps += LyricLine(prevEnd, \"\", l.timeMs, isGap = true)\n",
                      "        if (i > 0 && l.timeMs - prevEnd > 6000) withGaps += LyricLine(prevEnd, \"\", l.timeMs, isGap = true, gapProvenance = GapProvenance.INFERRED_TIMING)\n",
                  ),
              )
              for before, after in replacements:
                  if text.count(before) != 1:
                      raise RuntimeError("patch context mismatch")
                  text = text.replace(before, after, 1)
              target = text.encode("utf-8")
              if hashlib.sha256(target).hexdigest() != expected_target_sha256:
                  raise RuntimeError("target verification failed")

              blob = request(
                  "POST",
                  f"/repos/{repo}/git/blobs",
                  {"content": target.decode("utf-8"), "encoding": "utf-8"},
              )
              tree = request(
                  "POST",
                  f"/repos/{repo}/git/trees",
                  {
                      "base_tree": base_tree,
                      "tree": [
                          {"path": lyrics_path, "mode": "100644", "type": "blob", "sha": blob["sha"]},
                          {"path": helper_path, "mode": "100644", "type": "blob", "sha": None},
                      ],
                  },
              )
              created = request(
                  "POST",
                  f"/repos/{repo}/git/commits",
                  {
                      "message": "Apply approved lyrics timing provenance",
                      "tree": tree["sha"],
                      "parents": [expected_tip],
                  },
              )
              request(
                  "PATCH",
                  f"/repos/{repo}/git/refs/heads/{branch}",
                  {"sha": created["sha"], "force": False},
              )
              print(created["sha"])
          except Exception:
              raise SystemExit("bootstrap failed")
          PY
