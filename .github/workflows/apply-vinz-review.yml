name: Apply review-only Vinz source batch
on:
  push:
    branches: [fix/icons-shapes-stability]
    paths: [.github/workflows/apply-vinz-review.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/icons-shapes-stability
          fetch-depth: 0
      - name: Apply source and tests only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json, subprocess, sys
          from pathlib import Path
          def run(args, text=None):
              result = subprocess.run(args, input=text, text=True, capture_output=True)
              if result.returncode:
                  message = (result.stdout + result.stderr)[-6000:]
                  print("::error::" + message.replace("%", "%25").replace("\n", "%0A"))
                  sys.exit(result.returncode)
              print(result.stdout)
          parts = sorted(Path(".github/vinz-review-patch").glob("*.base64"))
          assert len(parts) == 8
          payload = json.loads(gzip.decompress(base64.b64decode("".join(p.read_text().strip() for p in parts))))
          patch = payload["patch"]
          run(["git", "apply", "--check", "--whitespace=error", "--exclude=app/src/main/java/com/vinz/music/ui/theme/AppIcons.kt"], patch)
          run(["git", "apply", "--whitespace=error", "--exclude=app/src/main/java/com/vinz/music/ui/theme/AppIcons.kt"], patch)
          for name, content in payload["files"].items():
              path = Path(name)
              assert name.startswith("app/src/") and ".." not in path.parts
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
          for part in parts:
              part.unlink()
          run(["git", "diff", "--check"])
          run(["git", "config", "user.name", "github-actions[bot]"])
          run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          run(["git", "add", "app/src", ".github/vinz-review-patch"])
          run(["git", "commit", "-m", "Restore default launcher icon and gate experimental split navigation"])
          run(["git", "push", "origin", "HEAD:fix/icons-shapes-stability"])
          PY
