name: Apply review-only Vinz source batch
on:
  push:
    branches: [fix/icons-shapes-stability]
    paths: [.github/workflows/apply-vinz-review.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/icons-shapes-stability
          fetch-depth: 0
      - name: Apply source and tests; remove this helper
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import base64, gzip, json, subprocess
          from pathlib import Path
          parts = sorted(Path(".github/vinz-review-patch").glob("*.base64"))
          assert len(parts) == 8
          encoded = "".join(p.read_text().strip() for p in parts)
          payload = json.loads(gzip.decompress(base64.b64decode(encoded)))
          patch = payload["patch"]
          for line in patch.splitlines():
              if line.startswith("+++ "):
                  assert line.startswith("+++ b/app/src/")
          subprocess.run(["git", "apply", "--check", "--whitespace=error"], input=patch, text=True, check=True)
          subprocess.run(["git", "apply", "--whitespace=error"], input=patch, text=True, check=True)
          for name, content in payload["files"].items():
              path = Path(name)
              assert name.startswith("app/src/") and ".." not in path.parts
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
          for part in parts:
              part.unlink()
          Path(".github/workflows/apply-vinz-review.yml").unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src .github/vinz-review-patch .github/workflows/apply-vinz-review.yml
          git commit -m "Restore default launcher icon and gate experimental split navigation"
          git push origin HEAD:fix/icons-shapes-stability
