name: Vinz platform worker tests

on:
  pull_request:
    paths:
      - "platform/cloudflare/**"
      - ".github/workflows/platform-worker-tests.yml"
  push:
    branches: ["**"]
    paths:
      - "platform/cloudflare/**"
      - ".github/workflows/platform-worker-tests.yml"

permissions:
  contents: read

jobs:
  cloudflare-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/cloudflare
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run Worker unit tests
        run: npm test
