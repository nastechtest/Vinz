name: Vinz platform worker tests

on:
  pull_request:
    paths:
      - "platform/cloudflare/**"
      - ".github/workflows/platform-worker-tests.yml"
  push:
    branches: ["**"]
    paths:
      - "platform/cloudflare/**"
      - ".github/workflows/platform-worker-tests.yml"

permissions:
  contents: read

jobs:
  cloudflare-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/cloudflare
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run Worker unit tests
        run: npm test
