name: Preview integration verification
on:
  push:
    branches: [feat/optional-next-track-preview]
permissions:
  contents: write
concurrency:
  group: preview-integration
  cancel-in-progress: true
jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply exact integration anchors
        run: python3 scripts/integrate_next_preview.py
      - name: Save generated source on feature branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main
          git commit -m "feat(player): integrate optional timeline-derived next-track preview"
          git push origin HEAD:feat/optional-next-track-preview
          echo "VINZ_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: ./scripts/ci/install-android-sdk.sh
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Run deterministic unit tests
        run: ./scripts/ci/run-unit-tests.sh --stacktrace
      - name: Lint and assemble
        run: ./gradlew :app:lintDebug :app:assembleDebug :baselineprofile:assemble --no-daemon --stacktrace
      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
