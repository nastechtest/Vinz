name: Vinz web checks and Cloudflare deployment

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/cloudflare-web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/cloudflare-web.yml"
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type deploy-home-production to deploy https://home.vinzmusic.workers.dev"
        required: true
        type: string

permissions:
  contents: read

env:
  CF_SEND_TELEMETRY: "false"

concurrency:
  group: vinz-home-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirm_deploy == 'deploy-home-production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Check Next.js compatibility
        working-directory: web
        run: npm run check:vinext
      - name: Build Cloudflare Worker
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://iszghebmetrbkfhnnoqq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_9UXwKG0oVlJ9zIkJ-bZKg_W-fkotZe' }}
          NEXT_PUBLIC_VINZ_API_URL: ${{ vars.NEXT_PUBLIC_VINZ_API_URL || 'https://api.vinzmusic.workers.dev' }}
        run: npm run build:vinext

  deploy-home:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'deploy-home-production' }}
    needs: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Verify exact production Worker target
        working-directory: web
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const c=fs.readFileSync("cloudflare.config.ts","utf8"); if (!/name:\s*"home"/.test(c) || !/workersDev:\s*true/.test(c)) process.exit(1);'
      - name: Build and deploy home.vinzmusic.workers.dev
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://iszghebmetrbkfhnnoqq.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_9UXwKG0oVlJ9zIkJ-bZKg_W-fkotZe' }}
          NEXT_PUBLIC_VINZ_API_URL: ${{ vars.NEXT_PUBLIC_VINZ_API_URL || 'https://api.vinzmusic.workers.dev' }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -n "$NEXT_PUBLIC_VINZ_API_URL"
          npm run check:vinext
          npm run build:vinext
          npm run deploy:cloudflare
      - name: Smoke-test the exact production hostname
        run: |
          set -euo pipefail
          url="https://home.vinzmusic.workers.dev/"
          for attempt in $(seq 1 12); do
            status=$(curl --silent --show-error --output /tmp/vinz-home.html --write-out '%{http_code}' "$url" || true)
            if [ "$status" = "200" ] && grep -qi "vinz" /tmp/vinz-home.html; then
              echo "Verified $url returned HTTP 200 and Vinz page content."
              exit 0
            fi
            echo "Attempt $attempt: $url returned HTTP ${status:-no-response}; retrying."
            sleep 10
          done
          echo "Cloudflare deployed, but the required home hostname did not pass its HTTP smoke test."
          exit 1
