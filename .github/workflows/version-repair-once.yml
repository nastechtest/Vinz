name: Complete version validation
on:
  push:
    branches: [feat/bantu-language-pickers]
    paths: [.github/workflows/version-repair-once.yml]
permissions:
  contents: read
jobs:
  finish:
    if: github.repository == 'nastechtest/Vinz' && github.ref == 'refs/heads/feat/bantu-language-pickers'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed validation and executable modes
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, subprocess
          patch = base64.b64decode(os.environ['PATCH_B64'])
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts
          git update-index --chmod=+x scripts/ci/version.sh scripts/tests/ci-scripts-test.sh scripts/ci/publish-main.sh scripts/tests/publish-main-test.sh
          git commit -m 'Complete short-version validation and restore executable helpers'
          git push origin HEAD:feat/bantu-language-pickers
