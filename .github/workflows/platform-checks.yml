name: Platform backend checks

on:
  pull_request:
    branches: [main, stable]
    paths:
      - "platform/cloudflare/**"
      - "supabase/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  push:
    branches: ["**"]
    paths:
      - "platform/cloudflare/**"
      - "supabase/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-worker:
    name: Cloudflare Worker syntax and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/cloudflare/package.json

      - name: Verify runtime and source syntax
        working-directory: platform/cloudflare
        run: |
          set -euo pipefail
          node --version
          npm --version
          node --check vinz-api.js
          node --check vinz-api.test.js

      - name: Validate Wrangler config and binding contracts
        working-directory: platform/cloudflare
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const assert = require("node:assert/strict");
          const configs = [
            { file: "wrangler.jsonc", name: "vinz-api-staging" },
            { file: "wrangler.production.jsonc", name: "vinz" },
          ];
          for (const expected of configs) {
            const config = JSON.parse(fs.readFileSync(expected.file, "utf8"));
            assert.equal(config.name, expected.name);
            assert.equal(config.main, "vinz-api.js");
            assert.ok(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(config.compatibility_date));
            assert.ok(config.kv_namespaces?.some((binding) => binding.binding === "CATALOG_CACHE" && binding.id));
            assert.ok(config.r2_buckets?.some((binding) => binding.binding === "BACKUPS_BUCKET" && binding.bucket_name));
            assert.ok(config.ratelimits?.some((binding) =>
              binding.name === "USERNAME_CHECK_LIMITER" &&
              binding.simple?.limit === 120 &&
              binding.simple?.period === 60
            ));
            assert.equal(config.observability?.enabled, true);
            assert.equal(config.observability?.traces?.enabled, true);
            assert.equal(JSON.stringify(config).includes("SUPABASE_SERVICE_ROLE_KEY"), false);
          }
          console.log("Staging and production Wrangler bindings are consistent and contain no privileged key.");
          NODE

      - name: Run Cloudflare API tests
        working-directory: platform/cloudflare
        run: npm test

  supabase-migrations:
    name: Supabase migration integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate migration ordering and non-empty SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("supabase/migrations")
          files = sorted(root.glob("*.sql"))
          if not files:
              raise SystemExit("No Supabase migration files found")
          versions = []
          for path in files:
              if path.stat().st_size == 0:
                  raise SystemExit(f"Empty migration: {path}")
              match = re.match(r"^([0-9]{14})_[a-z0-9_]+[.]sql$", path.name)
              if not match:
                  raise SystemExit(f"Migration must use YYYYMMDDHHMMSS_name.sql: {path.name}")
              versions.append(match.group(1))
          if len(versions) != len(set(versions)):
              raise SystemExit("Duplicate Supabase migration version detected")
          if versions != sorted(versions):
              raise SystemExit("Supabase migrations are not ordered")
          print(f"Validated {len(files)} timestamped Supabase migrations.")
          PY

      - name: Require verified-email gates on account-owned policies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/migrations/20261108140500_vinz_require_verified_email_for_account_policies.sql")
          sql = path.read_text()
          required = [
              "vinz_private.is_email_verified()",
              '"Vinz profiles update own profile"',
              '"Vinz account settings read own"',
              '"Vinz private account read own"',
              '"Vinz backups create own"',
              '"Vinz backup objects upload own"',
              '"Vinz friend requests sender create"',
              '"Vinz YouTube connection owner access"',
          ]
          missing = [item for item in required if item not in sql]
          if missing:
              raise SystemExit("Verified-email policy migration is incomplete: " + ", ".join(missing))
          if "auth.users u" not in sql or "u.email_confirmed_at is not null" not in sql:
              raise SystemExit("Verified-email policy must read auth.users.email_confirmed_at.")
          print("Verified-email function and account-owned RLS gates are present.")
          PY

      - name: Require verified-email gates on avatar writes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/migrations/20261108144000_vinz_require_verified_email_for_avatar_writes.sql")
          sql = path.read_text()
          lowered = sql.lower()
          required = {
              "Vinz avatar owner insert": "insert",
              "Vinz avatar owner update": "update",
              "Vinz avatar owner delete": "delete",
          }
          for name, operation in required.items():
              start = lowered.find(f'create policy "{name.lower()}"')
              if start < 0:
                  raise SystemExit(f"Missing avatar storage policy: {name}")
              end = lowered.find(";", start)
              if end < 0:
                  raise SystemExit(f"Unterminated avatar storage policy: {name}")
              clause = lowered[start:end]
              if f"for {operation}" not in clause:
                  raise SystemExit(f"{name} has the wrong operation.")
              for required_clause in ("vinz_private.is_email_verified()", "bucket_id = 'vinz-avatars'", "(storage.foldername(name))[1]"):
                  if required_clause not in clause:
                      raise SystemExit(f"{name} is missing {required_clause}")
          print("Avatar object writes are owner-scoped and require a verified email.")
          PY

      - name: Require least-privilege username RPC wrappers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          signup = Path("supabase/migrations/20261109150000_vinz_public_username_availability.sql").read_text().lower()
          hardening = Path("supabase/migrations/20261110190000_vinz_username_rpc_security_hardening.sql").read_text().lower()
          required = [
              "vinz_profiles_username_lower_uidx",
              "create or replace function vinz_private.vinz_username_available_for_signup",
              "create or replace function public.vinz_username_available_for_signup",
              "create or replace function public.vinz_username_available",
              "revoke all on function vinz_private.vinz_username_available_for_signup(text)",
              "grant execute on function vinz_private.vinz_username_available_for_signup(text) to anon",
              "grant execute on function public.vinz_username_available_for_signup(text) to anon",
              "grant execute on function public.vinz_username_available(text) to authenticated",
              "set search_path = ''",
          ]
          missing = [item for item in required if item not in signup + hardening]
          if missing:
              raise SystemExit("Username RPC hardening is incomplete: " + ", ".join(missing))

          def function_body(source, signature):
              start = source.index("create or replace function " + signature)
              end = source.index("$function$;", start)
              return source[start:end]

          private_signup = function_body(hardening, "vinz_private.vinz_username_available_for_signup")
          public_signup = function_body(hardening, "public.vinz_username_available_for_signup")
          public_profile = function_body(hardening, "public.vinz_username_available(")
          if "security definer" not in private_signup or "security invoker" not in public_signup or "security invoker" not in public_profile:
              raise SystemExit("Only private lookup helpers may be SECURITY DEFINER; exposed RPC wrappers must be SECURITY INVOKER.")
          if "security definer" in public_signup or "security definer" in public_profile:
              raise SystemExit("An exposed public username RPC still uses SECURITY DEFINER.")
          if any(term in private_signup for term in ("auth.users", "email", "user_id")):
              raise SystemExit("Signup availability helper must not read private account or email data.")
          if "grant execute on function public.vinz_username_available_for_signup(text) to authenticated" in hardening:
              raise SystemExit("Signup availability wrapper must remain limited to anon boolean lookup.")
          print("Public username RPCs are invoker-only; the boolean signup helper is private and narrowly granted.")
          PY

      - name: Require anonymous public-profile reads to expose public fields only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/migrations/20261112152000_vinz_public_profile_read_access.sql")
          sql = path.read_text().lower()
          normalized = " ".join(sql.split())
          required = [
              "revoke all on table public.vinz_profiles from anon",
              "grant select (username, display_name, bio, avatar_path, is_public) on table public.vinz_profiles to anon",
              'create policy "vinz public profiles read public" on public.vinz_profiles for select to anon using (is_public = true)',
          ]
          missing = [item for item in required if item not in normalized]
          if missing:
              raise SystemExit("Public profile access is incomplete: " + ", ".join(missing))
          if any(term in sql for term in ("security definer", "full_name", "email", "auth.users")):
              raise SystemExit("Anonymous public profile access must not use definer code or expose private account fields.")
          if "grant select on table public.vinz_profiles to anon" in normalized:
              raise SystemExit("Anonymous readers must not receive table-wide profile SELECT.")
          print("Anonymous profile reads are RLS-gated and limited to five public columns.")
          PY

      - name: Check Edge Function source is present
        run: |
          set -euo pipefail
          test -s supabase/functions/vinz-discovery/index.ts
          grep -q "MAX_WATCHES_PER_RUN" supabase/functions/vinz-discovery/index.ts
          grep -q "MAX_PODCASTS_PER_RUN" supabase/functions/vinz-discovery/index.ts

  workflow-hygiene:
    name: Workflow and patch hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whitespace errors
        run: git diff --check

      - name: Validate YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.load_file(f, aliases: true); puts "valid YAML: #{f}" }'
