name: Icons & shapes regression
on:
  pull_request:
    branches: [main, stable]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: icons-shapes-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  JAVA_VERSION: "17"
  VINZ_GIT_SHA: ${{ github.event.pull_request.head.sha }}
  VINZ_BUILD_CHANNEL: pr
jobs:
  icons-shapes-screen:
    name: Icons & shapes instrumented screen
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK packages
        run: ./scripts/ci/install-android-sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # Never write to the cache from a fork: a poisoned cache entry would be restored by later runs.
          cache-read-only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Install the API 34 emulator image
        run: |
          set -euo pipefail
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          avdmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort -V | tail -1)
          test -n "$sdkmanager"
          test -n "$avdmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --sdk_root="$ANDROID_HOME" emulator 'system-images;android-34;google_apis;x86_64'
          echo no | "$avdmanager" create avd --force --name vinz-api34 --package 'system-images;android-34;google_apis;x86_64' --abi google_apis/x86_64

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-vinz-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm

      - name: Assemble the focused test APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PsideBySide --no-daemon --stacktrace

      - name: Run Icons & shapes screen test
        run: |
          set -euo pipefail
          mkdir -p emulator-logs
          "$ANDROID_HOME/emulator/emulator" -avd vinz-api34 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel on >emulator-logs/emulator.log 2>&1 &
          emulator_pid=$!
          cleanup() {
            # Capture while the emulator is still alive; adb can otherwise hang after shutdown.
            timeout 15s adb -s emulator-5554 logcat -d -t 4000 > emulator-logs/logcat.txt || true
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          timeout 120s adb wait-for-device
          for _ in $(seq 1 60); do
            if [[ $(adb shell getprop sys.boot_completed | tr -d '\r') == 1 ]]; then
              break
            fi
            sleep 5
          done
          [[ $(adb shell getprop sys.boot_completed | tr -d '\r') == 1 ]] || {
            echo '::error::Android emulator did not finish booting within 300 seconds'
            exit 1
          }
          adb shell input keyevent 82
          ./gradlew :app:connectedDebugAndroidTest -PsideBySide \
            -Pandroid.testInstrumentationRunnerArguments.class=com.vinz.music.IconsShapesScreenTest \
            --no-daemon --stacktrace

      - name: Upload instrumented test reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: icons-shapes-screen-report-pr-${{ github.event.pull_request.number }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            emulator-logs/
          if-no-files-found: warn
          retention-days: 7

