name: Icons & shapes regression
on:
  pull_request:
    branches: [main, stable]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: icons-shapes-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  JAVA_VERSION: "17"
  VINZ_GIT_SHA: ${{ github.event.pull_request.head.sha }}
  VINZ_BUILD_CHANNEL: pr
jobs:
  icons-shapes-screen:
    name: Icons & shapes instrumented screen
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set shared AVD environment
        run: |
          set -euo pipefail
          {
            echo "ANDROID_AVD_HOME=$RUNNER_TEMP/vinz-android-user/avd"
            echo "ANDROID_USER_HOME=$RUNNER_TEMP/vinz-android-user"
          } >> "$GITHUB_ENV"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android emulator runtime libraries
        run: ./scripts/ci/install-emulator-runtime.sh

      - name: Install Android SDK packages
        run: |
          ./scripts/ci/install-android-sdk.sh
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Create and verify the API 34 emulator
        run: |
          set -Eeuo pipefail
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" emulator-logs
          exec > >(tee emulator-logs/avd-setup.log) 2>&1
          trap "echo ::error::AVD_setup_failed" ERR
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          avdmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort -V | tail -1)
          emulator_bin="$ANDROID_HOME/emulator/emulator"
          test -n "$sdkmanager"
          test -n "$avdmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --sdk_root="$ANDROID_HOME" emulator "system-images;android-34;google_apis;x86_64"
          test -x "$emulator_bin"
          echo no | "$avdmanager" create avd --force --name vinz-api34 --package "system-images;android-34;google_apis;x86_64" --abi google_apis/x86_64 --path "$ANDROID_AVD_HOME/vinz-api34.avd"
          test -f "$ANDROID_AVD_HOME/vinz-api34.ini"
          test -d "$ANDROID_AVD_HOME/vinz-api34.avd"
          "$emulator_bin" -list-avds | tee emulator-logs/available-avds.txt | grep -Fxq vinz-api34

      - name: Enable KVM
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo "::error::This runner has no KVM device"; exit 1; }
          sudo chmod a+rw /dev/kvm
          test -w /dev/kvm

      - name: Assemble the focused test APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PsideBySide --no-daemon --stacktrace

      - name: Run Icons & shapes screen test
        env:
          EMULATOR_SERIAL: emulator-5554
          EMULATOR_PORT: "5554"
        run: |
          set -Eeuo pipefail
          mkdir -p emulator-logs
          emulator_bin="$ANDROID_HOME/emulator/emulator"
          export ANDROID_SERIAL="$EMULATOR_SERIAL"

          fail() {
            echo "::error::$1" >&2
            tail -n 200 emulator-logs/emulator.log >&2 || true
            exit 1
          }

          cleanup() {
            exit_code=$?
            trap - EXIT
            set +e
            timeout 10s adb devices -l > emulator-logs/adb-devices.txt 2>&1 || true
            timeout 15s adb -s "$EMULATOR_SERIAL" logcat -d -t 4000 > emulator-logs/logcat.txt 2>&1 || true
            timeout 10s adb -s "$EMULATOR_SERIAL" emu kill > emulator-logs/emu-kill.log 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
            for _ in $(seq 1 10); do
              kill -0 "$emulator_pid" >/dev/null 2>&1 || break
              sleep 1
            done
            kill -9 "$emulator_pid" >/dev/null 2>&1 || true
            wait "$emulator_pid" >/dev/null 2>&1 || true
            exit "$exit_code"
          }

          test -x "$emulator_bin" || fail "Android emulator executable is missing: $emulator_bin"
          "$emulator_bin" -version > emulator-logs/emulator-version.txt 2>&1 || fail "Android emulator version check failed"
          "$emulator_bin" -accel-check > emulator-logs/accel-check.txt 2>&1 || fail "Android emulator acceleration check failed"
          timeout 15s adb start-server > emulator-logs/adb-start-server.txt 2>&1 || fail "adb server did not start within 15 seconds"
          "$emulator_bin" -avd vinz-api34 -port "$EMULATOR_PORT" -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel on > emulator-logs/emulator.log 2>&1 &
          emulator_pid=$!
          trap cleanup EXIT

          sleep 5
          kill -0 "$emulator_pid" >/dev/null 2>&1 || fail "Android emulator exited during startup"
          timeout 120s adb -s "$EMULATOR_SERIAL" wait-for-device || fail "Android emulator did not connect to adb within 120 seconds"
          timeout 10s adb -s "$EMULATOR_SERIAL" get-state | grep -qx device || fail "adb did not report the emulator as a device"

          boot_deadline=$((SECONDS + 300))
          boot_completed=""
          while (( SECONDS < boot_deadline )); do
            boot_completed="$(timeout 10s adb -s "$EMULATOR_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)"
            [[ "$boot_completed" == "1" ]] && break
            kill -0 "$emulator_pid" >/dev/null 2>&1 || fail "Android emulator exited before boot completed"
            sleep 5
          done
          [[ "$boot_completed" == "1" ]] || fail "Android emulator did not finish booting within 300 seconds"
          timeout 10s adb -s "$EMULATOR_SERIAL" shell input keyevent 82 || fail "Could not unlock Android emulator"
          ./gradlew :app:connectedDebugAndroidTest -PsideBySide \
            -Pandroid.testInstrumentationRunnerArguments.class=com.vinz.music.IconsShapesScreenTest \
            --no-daemon --stacktrace

      - name: Upload instrumented test reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: icons-shapes-screen-report-pr-${{ github.event.pull_request.number }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            emulator-logs/
          if-no-files-found: warn
          retention-days: 7
