# Stable release: manually triggered, validated, then held by a protected environment until a human approves.
#
# Nothing here runs on a push or a merge. A stable release exists only because a maintainer started this
# workflow, pointed it at an approved commit on "stable", and a reviewer approved the "stable-production"
# environment. Until that approval lands, no signing key is touched and no tag is created.
name: Stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version without the v prefix (e.g. 1.7.8). Must equal versionName in version.properties at the approved commit."
        required: true
        type: string
      commit_sha:
        description: "Full 40-character commit SHA on stable that has passed CI (e.g. from a merged release PR)."
        required: true
        type: string
      release_notes:
        description: "Optional: highlights or known issues to put at the top of the release notes."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  APP_PACKAGE: com.vinz.music
  JAVA_VERSION: "17"
  VINZ_GIT_SHA: ${{ inputs.commit_sha }}
  VINZ_BUILD_CHANNEL: stable

jobs:
  validate:
    name: Validate the release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No secrets are available to this job: validation cannot leak the signing key, and it must pass before
    # the approval gate is even reached.
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      version-code: ${{ steps.verify.outputs.version-code }}
      previous-tag: ${{ steps.verify.outputs.previous-tag }}
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit_sha }}
          # Full history and tags: ancestry, the previous stable tag and its versionCode all come from git.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify the commit, the version and the release history
        id: verify
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          die() { printf '::error::%s\n' "$*" >&2; exit 1; }

          version="$INPUT_VERSION"
          sha="$INPUT_SHA"

          # 1. The inputs are well formed. Anything else never reaches a shell downstream.
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || die "commit_sha must be a full 40-character lowercase SHA, got '$sha'"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] ||
            die "version must look like 1.7.8 (no 'v' prefix), got '$version'"

          # 2. The commit exists and is what we checked out.
          git cat-file -e "${sha}^{commit}" 2>/dev/null || die "commit $sha does not exist in this repository"
          actual=$(git rev-parse HEAD)
          [[ "$actual" == "$sha" ]] || die "checked out $actual but expected $sha"

          # 3. The commit is part of stable's history. Anything else is not a release candidate.
          git rev-parse --verify --quiet 'origin/stable^{commit}' >/dev/null ||
            die "branch 'stable' not found. Create it (see docs/RELEASING.md) before releasing."
          git merge-base --is-ancestor "$sha" origin/stable ||
            die "commit ${sha:0:7} is not on stable; merge the release PR into stable first"

          # 4. version.properties at that commit is the authority for the version.
          file_version=$(./scripts/ci/version.sh name-at "$sha")
          [[ "$file_version" == "$version" ]] ||
            die "version.properties at ${sha:0:7} says '$file_version' but the workflow was asked for '$version'. Bump version.properties in the release PR instead of passing a different version."
          file_code=$(./scripts/ci/version.sh code-at "$sha")
          echo "version.properties: $file_version (versionCode $file_code)"

          # 5. This version has not been released. Existing tags are never reused or moved.
          if git rev-parse --verify --quiet "refs/tags/v${version}" >/dev/null; then
            die "tag v${version} already exists: ${version} has been released. Tags are immutable."
          fi
          if git ls-remote --tags origin "refs/tags/v${version}" | grep -q .; then
            die "tag v${version} already exists on the remote: ${version} has been released."
          fi

          # 6. versionCode increases. Android refuses to install an APK whose versionCode is not higher than
          #    the installed one, so a published release must always move forward.
          previous_tag=$(./scripts/ci/version.sh previous-stable-tag)
          if [[ -n "$previous_tag" ]]; then
            previous_code=$(./scripts/ci/version.sh code-at "$previous_tag")
            [[ "$file_code" -gt "$previous_code" ]] ||
              die "versionCode $file_code is not greater than $previous_code from $previous_tag. Android would reject the update."
            echo "versionCode: $file_code > $previous_code ($previous_tag)"
          else
            echo "versionCode: $file_code (first stable release)"
          fi

          {
            echo "version=$version"
            echo "version-code=$file_code"
            echo "previous-tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::Release candidate ${version} (${sha:0:7}) validated."

      - name: Verify the commit passed CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.commit_sha }}
        run: ./scripts/ci/check-required-checks.sh "$SHA"

  release:
    name: Sign, tag and publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The approval gate. Configure "stable-production" with required reviewers and limit it to the "stable"
    # branch (docs/RELEASING.md). While this job waits, nothing below has run and no secret has been read.
    environment:
      name: stable-production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ inputs.version }}
    permissions:
      contents: write
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK packages
        run: ./scripts/ci/install-android-sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Confirm the approval gate is actually protected
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # If the environment does not exist, GitHub creates it without reviewers, and this workflow would
          # then publish without any human approval. Verify rather than assume.
          if rules=$(gh api "repos/${GITHUB_REPOSITORY}/environments/stable-production" \
              --jq '[.protection_rules[].type] | join(",")' 2>/dev/null); then
            echo "protection rules: ${rules:-none}"
            if [[ "$rules" != *required_reviewers* ]]; then
              echo "::error::The stable-production environment has no required reviewers, so this run was never approved by a human. Add required reviewers in Settings -> Environments before releasing."
              exit 1
            fi
          else
            echo "::warning::Could not read the environment's protection rules (the workflow token usually lacks permission). Confirm in Settings -> Environments -> stable-production that required reviewers are set."
          fi

      - name: Re-check that the version is still unreleased
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The approval may have taken hours; a tag could have appeared in the meantime.
          if git ls-remote --tags origin "refs/tags/v${INPUT_VERSION}" | grep -q .; then
            echo "::error::tag v${INPUT_VERSION} appeared while this release was waiting for approval. Nothing has been published."
            exit 1
          fi

      - name: Run the deterministic unit tests
        run: ./scripts/ci/run-unit-tests.sh

      - name: Import the release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

          # umask 077: the keystore and its passwords are readable only by this runner user.
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          [[ -s release-keystore.jks ]] || { echo "::error::Decoded keystore is empty; check ANDROID_KEYSTORE_BASE64."; exit 1; }

          cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          # Fail here, in seconds, if the alias or password is wrong - not after a 20 minute build.
          if ! keytool -list -keystore release-keystore.jks \
                -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore does not contain alias '$ANDROID_KEY_ALIAS', or ANDROID_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          echo "Signing key '$ANDROID_KEY_ALIAS' is present."

      # No -PdebugSign and no missing keystore.properties, so AGP selects the release signing config. If the
      # import above ever failed, the build would silently fall back to the debug key, which is why the
      # verification step below rejects a debug-signed APK.
      - name: Build the signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify the APK identity and signature
        env:
          EXPECTED_VERSION_NAME: ${{ needs.validate.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ needs.validate.outputs.version-code }}
        run: ./scripts/ci/verify-apk.sh app/build/outputs/apk/release/app-release.apk "$APP_PACKAGE"

      - name: Checksum and stage the release
        id: stage
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          VERSION_CODE: ${{ needs.validate.outputs.version-code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Vinz-${VERSION}-release.apk"
          ( cd dist && sha256sum "Vinz-${VERSION}-release.apk" > "Vinz-${VERSION}-release.apk.sha256" )
          checksum=$(awk '{print $1}' "dist/Vinz-${VERSION}-release.apk.sha256")
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $checksum"

      - name: Create the immutable tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] ||
            { echo "::error::HEAD is not the approved commit; refusing to tag"; exit 1; }
          git config user.name "Vinz Release"
          git config user.email "releases@users.noreply.github.com"
          # Annotated tag on the exact approved commit. Nothing else is ever tagged for a stable release, and
          # the tag is never moved: a released version is a permanent fact.
          git tag -a "v${VERSION}" -m "Vinz ${VERSION}" "$RELEASE_SHA"
          git push origin "refs/tags/v${VERSION}"
          echo "Tagged v${VERSION} at ${RELEASE_SHA}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          VERSION_CODE: ${{ needs.validate.outputs.version-code }}
          CHECKSUM: ${{ steps.stage.outputs.checksum }}
          PREVIOUS_TAG: ${{ needs.validate.outputs.previous-tag }}
          NOTES: ${{ inputs.release_notes }}
          # workflow_dispatch sets GITHUB_SHA to the default branch's tip, which is NOT necessarily the
          # approved commit: the commit checkouts below pinned must be read from HEAD.
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] ||
            { echo "::error::checked out $(git rev-parse HEAD), expected $RELEASE_SHA"; exit 1; }
          {
            echo "## Vinz ${VERSION}"
            echo
            if [[ -n "${NOTES:-}" ]]; then
              printf '%s\n\n' "$NOTES"
            fi
            echo "Signed release build for Android ${APP_PACKAGE}. Install with \`adb install -r Vinz-${VERSION}-release.apk\`"
            echo "or by opening the APK on the device."
            echo
            echo "### Changes"
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "Since \`${PREVIOUS_TAG}\`:"
              echo
              git log --no-merges --pretty='- %s (%h)' "${PREVIOUS_TAG}..${RELEASE_SHA}" || true
            else
              echo "First stable release. Recent work:"
              echo
              git log --no-merges -n 40 --pretty='- %s (%h)' "${RELEASE_SHA}" || true
            fi
            echo
            echo "### Build information"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`${VERSION}\` |"
            echo "| versionCode | \`${VERSION_CODE}\` |"
            echo "| Commit | \`${RELEASE_SHA}\` |"
            echo "| Tag | \`v${VERSION}\` |"
            echo "| APK SHA-256 | \`${CHECKSUM}\` |"
            echo "| Signed with | release key (see the verification step in the workflow run) |"
            echo "| Released | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| Workflow run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
          } > release-notes.md

          gh release create "v${VERSION}" \
            "dist/Vinz-${VERSION}-release.apk#Vinz-${VERSION}-release.apk" \
            "dist/Vinz-${VERSION}-release.apk.sha256#Vinz-${VERSION}-release.apk.sha256" \
            --title "Vinz ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest

          echo "::notice::Published Vinz ${VERSION} from ${RELEASE_SHA}"

      - name: Confirm the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "v${VERSION}" --json tagName,isPrerelease,isDraft,assets \
            --jq '"tag: \(.tagName)  draft: \(.isDraft)  prerelease: \(.isPrerelease)  assets: \([.assets[].name] | join(", "))"'

      - name: Remove signing material
        if: always()
        run: |
          rm -f keystore.properties release-keystore.jks
          rm -rf dist

      - name: Write the job summary
        if: always()
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          VERSION_CODE: ${{ needs.validate.outputs.version-code }}
          CHECKSUM: ${{ steps.stage.outputs.checksum }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "## Stable release ${VERSION}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Result | **${STATUS}** |"
            echo "| Version | \`${VERSION}\` (versionCode \`${VERSION_CODE}\`) |"
            echo "| Commit | \`${RELEASE_SHA}\` |"
            echo "| Tag | \`v${VERSION}\` |"
            echo "| APK SHA-256 | \`${CHECKSUM:-n/a}\` |"
            echo "| Approver | approved via the \`stable-production\` environment |"
          } >> "$GITHUB_STEP_SUMMARY"
