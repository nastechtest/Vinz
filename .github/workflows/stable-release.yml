# Release: pick a bump and a channel, and nothing else.
#
#   patch / minor / major   the version is worked out from the newest stable tag and version.properties;
#                           nobody types a version or a commit SHA.
#   preview                 a signed prerelease you can install and try, without claiming a version or
#                           touching a branch.
#   stable                  the same build, published as the stable release, tagged immutably.
#
# The version lives in the tag once a release exists: version.sh takes the higher of version.properties
# and the newest stable tag, so a file that lags behind can never hand out a version twice. The APK is
# stamped with -PciVersionName / -PciVersionCode, so the file does not have to be rewritten to be correct.
#
# Signing keys are read only by the "release" job, behind the stable-production environment. If that
# environment has required reviewers, both channels wait for one approval; if it has none, a run goes
# straight through. Set reviewers in Settings -> Environments -> stable-production to require a human.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: "preview = signed prerelease to try first; stable = publish it"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable
      release_notes:
        description: "Optional: highlights or known issues for the top of the release notes"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_PACKAGE: com.vinz.music
  JAVA_VERSION: "17"

jobs:
  prepare:
    name: Work out the next version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only, no secrets: nothing here can touch the signing key.
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          # Full history and tags: the previous stable tag decides the next version and its versionCode.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Compute the version the bump asks for
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          die() { printf '::error::%s\n' "$*" >&2; exit 1; }

          version=$(./scripts/ci/version.sh bump-name "$BUMP")
          version_code=$(./scripts/ci/version.sh bump-code)
          sha=$(git rev-parse HEAD)

          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || die "'$version' is not a dotted numeric version"

          # A preview never takes the stable tag; the run number keeps preview tags distinct and the
          # hyphen keeps them out of version.sh's stable-tag list, so they can never be "the latest release".
          if [[ "$CHANNEL" == stable ]]; then
            tag="v${version}"
            if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
              die "tag ${tag} already exists: ${version} has been released. Tags are immutable; pick another bump."
            fi
          else
            tag="v${version}-preview.${GITHUB_RUN_NUMBER}"
          fi

          {
            echo "version=${version}"
            echo "version_code=${version_code}"
            echo "tag=${tag}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

          previous=$(./scripts/ci/version.sh previous-stable-tag || true)
          echo "::notice::${CHANNEL}: ${version} (versionCode ${version_code}, tag ${tag}) from ${sha:0:7}; previous release ${previous:-none}"

      - name: Confirm the default branch passed CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/check-required-checks.sh "${{ steps.version.outputs.sha }}"

  release:
    name: ${{ inputs.channel == 'stable' && 'Sign, tag and publish' || 'Sign and publish a preview' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The approval gate and the only place the signing key is read. Waiting here means no secret has been
    # touched and no tag has been created.
    environment:
      name: stable-production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Check out the commit being released
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Note whether the approval gate is actually protected
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A warning rather than a failure: an unprotected environment is a deliberate choice to let a
          # run publish without a human, and this workflow should not overrule it. Say so loudly instead.
          if rules=$(gh api "repos/${GITHUB_REPOSITORY}/environments/stable-production" \
              --jq '[.protection_rules[].type] | join(",")' 2>/dev/null); then
            if [[ "$rules" != *required_reviewers* ]]; then
              echo "::warning::stable-production has no required reviewers, so this run publishes without a human approval. Add reviewers in Settings -> Environments to require one."
            fi
          else
            echo "::notice::Could not read the environment's protection rules (the workflow token usually lacks permission). Check Settings -> Environments -> stable-production."
          fi

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK packages
        run: ./scripts/ci/install-android-sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Run the deterministic unit tests
        run: ./scripts/ci/run-unit-tests.sh

      - name: Import the release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

          # umask 077: the keystore and its passwords are readable only by this runner user.
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          [[ -s release-keystore.jks ]] || { echo "::error::Decoded keystore is empty; check ANDROID_KEYSTORE_BASE64."; exit 1; }

          cat > keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          # Fail here, in seconds, if the alias or password is wrong - not after a 20 minute build.
          if ! keytool -list -keystore release-keystore.jks \
                -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore does not contain alias '$ANDROID_KEY_ALIAS', or ANDROID_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          echo "Signing key '$ANDROID_KEY_ALIAS' is present."

      # No -PdebugSign and keystore.properties present, so AGP selects the release signing config. If the
      # import above ever failed, the build would silently fall back to the debug key, which is why the
      # verification step below rejects a debug-signed APK.
      - name: Build the signed release APK
        env:
          VINZ_GIT_SHA: ${{ needs.prepare.outputs.sha }}
          VINZ_BUILD_CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          set -euo pipefail
          # Stamped rather than written into version.properties: the same tree produces either channel,
          # and nothing has to be committed to get the right version into Settings -> About.
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PciVersionName="$VERSION" -PciVersionCode="$VERSION_CODE" -Pchannel=stable

      - name: Verify the APK identity and signature
        env:
          EXPECTED_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: ./scripts/ci/verify-apk.sh app/build/outputs/apk/release/app-release.apk "$APP_PACKAGE"

      - name: Checksum and stage the release
        id: stage
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Vinz-${VERSION}-release.apk"
          ( cd dist && sha256sum "Vinz-${VERSION}-release.apk" > "Vinz-${VERSION}-release.apk.sha256" )
          checksum=$(awk '{print $1}' "dist/Vinz-${VERSION}-release.apk.sha256")
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $checksum"

      - name: Create the immutable release tag
        if: inputs.channel == 'stable'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] ||
            { echo "::error::HEAD is not the commit being released; refusing to tag"; exit 1; }
          # The approval may have taken a while; a tag could have appeared meanwhile. Re-check, never reuse.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::tag ${TAG} appeared while this release waited for approval. Nothing has been published."
            exit 1
          fi
          git config user.name "Vinz Release"
          git config user.email "releases@users.noreply.github.com"
          # Annotated tag on the released commit, never moved: a released version is a permanent fact.
          # The message records the versionCode, because the APK is stamped rather than committed and this
          # tag is the only durable record of what was released. version.sh reads it back for the next bump.
          git tag -a "$TAG" -m "Vinz ${TAG#v}" -m "versionCode: ${VERSION_CODE}" "$RELEASE_SHA"
          git push origin "refs/tags/${TAG}"
          echo "Tagged ${TAG} at ${RELEASE_SHA}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHECKSUM: ${{ steps.stage.outputs.checksum }}
          NOTES: ${{ inputs.release_notes }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          previous=$(./scripts/ci/version.sh previous-stable-tag || true)

          {
            if [[ "$CHANNEL" == stable ]]; then
              echo "## Vinz ${VERSION}"
            else
              echo "## Vinz ${VERSION} — preview"
              echo
              echo "**PREVIEW — NOT A STABLE RELEASE.** ${VERSION} has not been published as stable yet."
              echo "Install it, try it, and publish the same version from the Release workflow when you are happy."
            fi
            echo
            if [[ -n "${NOTES:-}" ]]; then
              printf '%s\n\n' "$NOTES"
            fi
            echo "Signed with the Vinz release key for Android \`${APP_PACKAGE}\`. Install with"
            echo "\`adb install -r Vinz-${VERSION}-release.apk\`, or by opening the APK on the device."
            echo
            echo "### Changes"
            echo
            if [[ -n "$previous" ]]; then
              echo "Since \`${previous}\`:"
              echo
              git log --no-merges --pretty='- %s (%h)' "${previous}..${RELEASE_SHA}" || true
            else
              echo "First stable release. Recent work:"
              echo
              git log --no-merges -n 40 --pretty='- %s (%h)' "${RELEASE_SHA}" || true
            fi
            echo
            echo "### Build information"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`${VERSION}\` |"
            echo "| versionCode | \`${VERSION_CODE}\` |"
            echo "| Channel | \`${CHANNEL}\` |"
            echo "| Commit | \`${RELEASE_SHA}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| APK SHA-256 | \`${CHECKSUM}\` |"
            echo "| Signed with | release key (see the verification step in the workflow run) |"
            echo "| Released | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| Workflow run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
          } > release-notes.md

          # -R on every call: gh must not have to discover the repository from a working copy.
          if [[ "$CHANNEL" == stable ]]; then
            gh release create "$TAG" \
              "dist/Vinz-${VERSION}-release.apk#Vinz-${VERSION}-release.apk" \
              "dist/Vinz-${VERSION}-release.apk.sha256#Vinz-${VERSION}-release.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vinz ${VERSION}" \
              --notes-file release-notes.md \
              --verify-tag \
              --latest
          else
            # --target lets gh create the preview tag itself, at the commit that was built.
            gh release create "$TAG" \
              "dist/Vinz-${VERSION}-release.apk#Vinz-${VERSION}-release.apk" \
              "dist/Vinz-${VERSION}-release.apk.sha256#Vinz-${VERSION}-release.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vinz ${VERSION} — preview" \
              --notes-file release-notes.md \
              --prerelease \
              --target "$RELEASE_SHA"
          fi

          echo "::notice::Published ${TAG} (${CHANNEL}) from ${RELEASE_SHA}"

      - name: Confirm the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,isDraft,assets \
            --jq '"tag: \(.tagName)  draft: \(.isDraft)  prerelease: \(.isPrerelease)  assets: \([.assets[].name] | join(", "))"'

      - name: Remove signing material
        if: always()
        run: |
          rm -f keystore.properties release-keystore.jks
          rm -rf dist

      - name: Write the job summary
        if: always()
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHECKSUM: ${{ steps.stage.outputs.checksum }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "## ${CHANNEL} release ${VERSION}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Result | **${STATUS}** |"
            echo "| Version | \`${VERSION}\` (versionCode \`${VERSION_CODE}\`) |"
            echo "| Channel | \`${CHANNEL}\` |"
            echo "| Commit | \`${RELEASE_SHA}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| APK SHA-256 | \`${CHECKSUM:-n/a}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
