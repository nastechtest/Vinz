name: Apply focused icon repair
on:
  push:
    branches: [fix/icons-shapes-stability]
    paths: [.github/workflows/apply-icon-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/icons-shapes-stability
          fetch-depth: 0
      - name: Verify and apply the reviewed patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          files = sorted(pathlib.Path('.').glob('.icon-repair-part-*.txt'))
          assert len(files) == 4, 'Expected four patch parts'
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in files)))
          assert hashlib.sha256(patch).hexdigest() == 'b56f56d52d3f13c7a290f6a2e8539b82c82b2ddec93fd348a312cea3bb413adf'
          pathlib.Path('/tmp/icon-repair.patch').write_bytes(patch)
          PY
          git apply --check --exclude=.github/workflows/pr-checks.yml /tmp/icon-repair.patch
          git apply --exclude=.github/workflows/pr-checks.yml /tmp/icon-repair.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git rm .icon-repair-part-*.txt
          git commit -m 'Fix Icons & shapes safety and transparent icon foregrounds'
          if ! git push origin HEAD:fix/icons-shapes-stability 2>/tmp/push-error; then
            while IFS= read -r line; do echo "::error::$line"; done </tmp/push-error
            exit 1
          fi
