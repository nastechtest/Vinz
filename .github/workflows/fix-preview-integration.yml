name: Repair preview integration
on:
  push:
    branches: [feat/optional-next-track-preview]
    paths: [.github/workflows/fix-preview-integration.yml]
permissions:
  contents: write
jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/optional-next-track-preview
      - name: Repair exact integration omissions
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape
          p = Path("app/src/main/java/com/vinz/music/data/looks/Looks.kt")
          s = p.read_text()
          anchor = '"show_playing_from" to tr(R.string.playing_from),'
          addition = '"show_next_track" to tr(R.string.show_next_track_preview),'
          if addition not in s:
              assert s.count(anchor) == 1, "Looks label anchor drift"
              p.write_text(s.replace(anchor, anchor + "\n            " + addition))
          translations = {
            "es": ["Mostrar siguiente canción", "Sigue el orden de reproducción, incluidos el modo aleatorio y la repetición. Toca para abrir la cola.", "A continuación", "Abrir cola"],
            "hu": ["Következő szám megjelenítése", "Követi a lejátszási sorrendet, a keverést és az ismétlést is. Koppints a sor megnyitásához.", "Következő", "Lejátszási sor megnyitása"],
            "ko": ["다음 곡 표시", "셔플과 반복을 포함한 재생 순서를 따릅니다. 탭하여 대기열을 엽니다.", "다음 곡", "대기열 열기"],
            "ja": ["次の曲を表示", "シャッフルとリピートを含む再生順序に従います。タップするとキューが開きます。", "次の曲", "キューを開く"],
            "el": ["Εμφάνιση επόμενου τραγουδιού", "Ακολουθεί τη σειρά αναπαραγωγής, με τυχαία αναπαραγωγή και επανάληψη. Πατήστε για άνοιγμα της ουράς.", "Ακολουθεί", "Άνοιγμα ουράς"],
            "pt-rBR": ["Mostrar próxima música", "Segue a ordem de reprodução, incluindo o modo aleatório e a repetição. Toque para abrir a fila.", "A seguir", "Abrir fila"],
            "iw": ["הצגת השיר הבא", "לפי סדר ההשמעה, כולל ערבוב וחזרה. יש להקיש לפתיחת התור.", "הבא בתור", "פתיחת התור"],
            "hi": ["अगला गाना दिखाएँ", "शफ़ल और दोहराव सहित चलाने के क्रम का पालन करता है। कतार खोलने के लिए टैप करें।", "अगला गाना", "कतार खोलें"],
            "sv": ["Visa nästa låt", "Följer uppspelningsordningen, även blandning och upprepning. Tryck för att öppna kön.", "Härnäst", "Öppna kön"],
            "ro": ["Arată melodia următoare", "Urmează ordinea de redare, inclusiv redarea aleatorie și repetarea. Atinge pentru a deschide coada.", "Urmează", "Deschide coada"],
            "ur": ["اگلا گانا دکھائیں", "شفل اور دہرانے سمیت پلے بیک کی ترتیب کی پیروی کرتا ہے۔ قطار کھولنے کے لیے تھپتھپائیں۔", "اگلا گانا", "قطار کھولیں"],
            "ms": ["Tunjukkan lagu seterusnya", "Mengikut urutan main balik, termasuk rawak dan ulang. Ketik untuk membuka baris gilir.", "Seterusnya", "Buka baris gilir"],
            "th": ["แสดงเพลงถัดไป", "ตามลำดับการเล่น รวมถึงการสุ่มและการเล่นซ้ำ แตะเพื่อเปิดคิว", "เพลงถัดไป", "เปิดคิว"],
            "zh-rTW": ["顯示下一首歌曲", "依照播放順序，包含隨機播放與重複播放。點選以開啟佇列。", "下一首", "開啟佇列"],
            "tr": ["Sonraki şarkıyı göster", "Karıştırma ve tekrar dahil oynatma sırasını izler. Kuyruğu açmak için dokunun.", "Sıradaki", "Kuyruğu aç"],
            "de": ["Nächsten Titel anzeigen", "Folgt der Wiedergabereihenfolge, einschließlich Zufallswiedergabe und Wiederholung. Tippen öffnet die Warteschlange.", "Als Nächstes", "Warteschlange öffnen"],
            "nl": ["Volgend nummer tonen", "Volgt de afspeelvolgorde, inclusief shuffle en herhalen. Tik om de wachtrij te openen.", "Hierna", "Wachtrij openen"],
            "ru": ["Показывать следующий трек", "Следует порядку воспроизведения, включая перемешивание и повтор. Нажмите, чтобы открыть очередь.", "Далее", "Открыть очередь"],
            "cs": ["Zobrazit další skladbu", "Respektuje pořadí přehrávání včetně náhodného přehrávání a opakování. Klepnutím otevřete frontu.", "Následuje", "Otevřít frontu"],
            "fr": ["Afficher le titre suivant", "Suit l’ordre de lecture, y compris la lecture aléatoire et la répétition. Appuyez pour ouvrir la file d’attente.", "À suivre", "Ouvrir la file d’attente"],
            "in": ["Tampilkan lagu berikutnya", "Mengikuti urutan pemutaran, termasuk acak dan ulangi. Ketuk untuk membuka antrean.", "Berikutnya", "Buka antrean"],
            "pl": ["Pokaż następny utwór", "Uwzględnia kolejność odtwarzania, losowanie i powtarzanie. Dotknij, aby otworzyć kolejkę.", "Następny", "Otwórz kolejkę"],
            "pt-rPT": ["Mostrar próxima música", "Segue a ordem de reprodução, incluindo o modo aleatório e a repetição. Toque para abrir a fila.", "A seguir", "Abrir fila"],
            "bn": ["পরের গান দেখান", "শাফল ও পুনরাবৃত্তিসহ প্লেব্যাকের ক্রম অনুসরণ করে। সারি খুলতে ট্যাপ করুন।", "পরের গান", "সারি খুলুন"],
            "zh-rCN": ["显示下一首歌曲", "遵循播放顺序，包括随机播放和重复播放。点按可打开队列。", "下一首", "打开队列"],
            "uk": ["Показувати наступний трек", "Дотримується порядку відтворення, зокрема перемішування й повторення. Натисніть, щоб відкрити чергу.", "Далі", "Відкрити чергу"],
            "b+fil": ["Ipakita ang susunod na kanta", "Sinusunod ang pagkakasunod ng pag-play, kasama ang shuffle at pag-ulit. I-tap upang buksan ang pila.", "Susunod", "Buksan ang pila"],
            "fa": ["نمایش آهنگ بعدی", "از ترتیب پخش، شامل پخش تصادفی و تکرار، پیروی می‌کند. برای باز کردن صف ضربه بزنید.", "آهنگ بعدی", "باز کردن صف"],
            "it": ["Mostra il brano successivo", "Segue l’ordine di riproduzione, inclusi riproduzione casuale e ripetizione. Tocca per aprire la coda.", "A seguire", "Apri coda"],
            "ar": ["عرض الأغنية التالية", "يتبع ترتيب التشغيل، بما في ذلك التشغيل العشوائي والتكرار. اضغط لفتح قائمة الانتظار.", "التالي", "فتح قائمة الانتظار"],
            "vi": ["Hiện bài hát tiếp theo", "Theo thứ tự phát, bao gồm phát ngẫu nhiên và lặp lại. Nhấn để mở hàng đợi.", "Tiếp theo", "Mở hàng đợi"],
          }
          keys = ["show_next_track_preview", "show_next_track_preview_detail", "next_track_preview_label", "next_track_preview_open_queue"]
          root = Path("app/src/main/res")
          langs = {d.name.removeprefix("values-") for d in root.glob("values-*") if (d / "strings.xml").exists() and "<string " in (d / "strings.xml").read_text()}
          assert langs == set(translations), f"Unexpected languages: {langs ^ set(translations)}"
          for lang, texts in translations.items():
              p = root / ("values-" + lang) / "strings.xml"
              s = p.read_text()
              assert s.count("</resources>") == 1
              present = {e.attrib.get("name") for e in ET.fromstring(s).findall("string")}
              additions = []
              for key, text in zip(keys, texts):
                  if key not in present:
                      text = escape(text).replace(chr(39), chr(92) + chr(39))
                      additions.append(f'    <string name="{key}">{text}</string>')
              if additions:
                  s = s.replace("</resources>", "\n".join(additions) + "\n</resources>")
                  ET.fromstring(s)
                  p.write_text(s)
          Path(".github/workflows/fix-preview-integration.yml").unlink()
      - name: Commit only repaired integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/vinz/music/data/looks/Looks.kt app/src/main/res .github/workflows/fix-preview-integration.yml
          git commit -m "fix(player): label preview in Looks and localize all preview strings"
          git push origin HEAD:feat/optional-next-track-preview
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: ./scripts/ci/install-android-sdk.sh
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Run deterministic unit tests
        run: ./scripts/ci/run-unit-tests.sh
      - name: Run lint and assemble
        if: always()
        run: ./gradlew :app:lintDebug :app:assembleDebug :baselineprofile:assemble --no-daemon --stacktrace
      - name: Publish verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-repair-reports
          path: |
            app/build/reports
            app/build/test-results
          retention-days: 7
