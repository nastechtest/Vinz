# Development builds from main: every merged PR produces a uniquely numbered, installable APK, and a single
# rolling "Main — Latest" prerelease always points at the most recent one.
#
# Build number = number of commits on main. Derived from git history rather than a counter file, so it is
# monotonic, race-free (two runners cannot disagree about a commit's position) and reproducible: the same
# commit always yields the same number, and adding a commit always yields a new one.
name: Main build

on:
  push:
    branches: [main]
  # Recovery only: rebuild the current main tip without touching history.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a build that has been queued must still publish its own commit correctly.
concurrency:
  group: main-build
  cancel-in-progress: false

env:
  # VinzM: its own package id, so it installs beside Vinz (stable) and VinzP (a PR build) instead of over them.
  APP_PACKAGE: com.vinz.music.main
  JAVA_VERSION: "17"
  VINZ_GIT_SHA: ${{ github.sha }}
  VINZ_BUILD_CHANNEL: main

jobs:
  build:
    name: Build development APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      label: ${{ steps.build-id.outputs.label }}
      version-name: ${{ steps.build-id.outputs.version-name }}
      version-code: ${{ steps.build-id.outputs.version-code }}
      apk-name: ${{ steps.build-id.outputs.apk-name }}
    steps:
      # fetch-depth 0: the build number is the commit count on main, which a shallow clone cannot report.
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK packages
        run: ./scripts/ci/install-android-sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Compute the development build identifier
        id: build-id
        run: |
          set -euo pipefail
          label=$(./scripts/ci/version.sh main)
          base=$(./scripts/ci/version.sh name)
          build_number=${label##*.}
          short_sha=$(git rev-parse --short=7 HEAD)
          stamped="${base}-main.${build_number}"
          # Android only installs an APK whose versionCode is higher than the installed one, and the in-app
          # updater refuses anything else -- so each build of VinzM needs a rising code of its own.
          version_code=$(./scripts/ci/version.sh build-code "$build_number")
          {
            echo "label=$label"
            echo "number=$build_number"
            echo "version-name=$stamped"
            echo "version-code=$version_code"
            echo "short-sha=$short_sha"
            echo "apk-name=Vinz-main-${base}-build-${build_number}.apk"
          } >> "$GITHUB_OUTPUT"
          echo "Development build: $label ($short_sha, versionCode $version_code)"

      - name: Run deterministic unit tests
        run: ./scripts/ci/run-unit-tests.sh

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Assemble debug APK and baseline profile module
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug :baselineprofile:assemble \
            -PciVersionName="${{ steps.build-id.outputs.version-name }}" \
            -PciVersionCode="${{ steps.build-id.outputs.version-code }}" \
            -Pchannel=main \
            --no-daemon --stacktrace

      - name: Verify the APK
        env:
          ALLOW_DEBUG_SIGNATURE: "true"
          EXPECTED_VERSION_NAME: ${{ steps.build-id.outputs.version-name }}
          EXPECTED_VERSION_CODE: ${{ steps.build-id.outputs.version-code }}
        run: ./scripts/ci/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk "$APP_PACKAGE"

      - name: Stage the development build
        env:
          APK_NAME: ${{ steps.build-id.outputs.apk-name }}
          LABEL: ${{ steps.build-id.outputs.label }}
          VERSION_NAME: ${{ steps.build-id.outputs.version-name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          sha256sum "dist/${APK_NAME}" | awk '{print $1}' > "dist/${APK_NAME}.sha256"
          {
            echo "DEVELOPMENT BUILD - NOT A STABLE RELEASE"
            echo
            echo "build:       ${LABEL}"
            echo "versionName: ${VERSION_NAME}"
            echo "commit:      ${GITHUB_SHA}"
            echo "ref:         ${GITHUB_REF_NAME}"
            echo "package:     ${APP_PACKAGE}"
            echo "sha256:      $(cat "dist/${APK_NAME}.sha256")"
            echo "built:       $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Install: adb install -r ${APK_NAME}"
          } > dist/BUILD-INFO.txt
          cat dist/BUILD-INFO.txt

      - name: Upload the development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build-id.outputs.apk-name }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS || 14 }}

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7

      - name: Write the job summary
        env:
          LABEL: ${{ steps.build-id.outputs.label }}
          VERSION_NAME: ${{ steps.build-id.outputs.version-name }}
          APK_NAME: ${{ steps.build-id.outputs.apk-name }}
          SHORT_SHA: ${{ steps.build-id.outputs.short-sha }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$STATUS" in
            success) verdict="PASSED" ;;
            *) verdict="FAILED ($STATUS)" ;;
          esac
          {
            echo "## DEVELOPMENT BUILD - NOT A STABLE RELEASE"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Result | **${verdict}** |"
            echo "| Build | \`${LABEL}\` |"
            echo "| versionName stamped | \`${VERSION_NAME}\` |"
            echo "| Commit | \`${SHORT_SHA}\` (${GITHUB_SHA}) |"
            echo "| APK | \`${APK_NAME}\` |"
            echo
            echo "A successful build refreshes the rolling prerelease **Main — Latest**."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish Main — Latest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Write access is confined to this job; the build above runs with contents: read only.
    permissions:
      contents: write
    steps:
      - name: Download the development APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.apk-name }}
          path: dist

      - name: Move the rolling tag and refresh the prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no working copy (it only downloads the APK), so `gh` cannot discover the repo from a
          # git remote. Point it at the repository explicitly, here and with -R below.
          GH_REPO: ${{ github.repository }}
          APK_NAME: ${{ needs.build.outputs.apk-name }}
          LABEL: ${{ needs.build.outputs.label }}
          VERSION_NAME: ${{ needs.build.outputs.version-name }}
        run: |
          set -euo pipefail
          apk="dist/${APK_NAME}"

          # "main-latest" is deliberately the only mutable ref in this repository: a pointer at the newest
          # development build. It never matches "v*", so it cannot collide with a stable release tag, and no
          # immutable version tag is ever moved.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/main-latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/main-latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/main-latest" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "main-latest -> $GITHUB_SHA"

          checksum=$(cat "dist/${APK_NAME}.sha256")
          cat > release-notes.md <<EOF
          **DEVELOPMENT BUILD — NOT A STABLE RELEASE**

          Automatic build of \`main\`. It may be broken, half-finished or unreviewed by anyone but its author.
          For a build you can rely on, use the latest stable release.

          | | |
          | --- | --- |
          | Build | \`${LABEL}\` |
          | versionName | \`${VERSION_NAME}\` |
          | Commit | \`${GITHUB_SHA}\` |
          | APK | \`${APK_NAME}\` |
          | SHA-256 | \`${checksum}\` |
          | Built | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          ### Install

          \`\`\`bash
          adb install -r ${APK_NAME}
          \`\`\`

          This is **VinzM** (\`com.vinz.music.main\`), a separate app from Vinz and VinzP: it installs beside
          them rather than over them. It is debug-signed, and it updates itself from this release, so a later
          build of \`main\` reaches a phone that already has it (Settings -> About -> Check for updates).
          Settings -> About shows \`${VERSION_NAME}\`.
          EOF

          # Recreated rather than edited so the release always targets the newest commit (a moved tag does
          # not update a release's target on its own). --cleanup-tag=false keeps the tag we just moved.
          # -R on each call: no working copy here, so gh must not go looking for one.
          # --verify-tag is gone: the tag was created or moved by the API three lines above and its result was
          # already checked, so there is nothing left to verify -- and it is the flag that reaches for git.
          gh release delete main-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false >/dev/null 2>&1 || true
          gh release create main-latest \
            "$apk#${APK_NAME}" \
            "dist/${APK_NAME}.sha256#${APK_NAME}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Main — Latest (development)" \
            --notes-file release-notes.md \
            --prerelease

          echo "::notice::Latest development build: ${LABEL} (${GITHUB_SHA})"
