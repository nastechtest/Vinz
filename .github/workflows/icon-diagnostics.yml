name: Read icon build compiler diagnostics
on:
  push:
    branches: [fix/icons-shapes-stability]
    paths: [.github/workflows/icon-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize compiler errors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/nastechtest/Vinz/actions/jobs/127760056345/logs > /tmp/compiler-log.txt
          python3 - <<'PY'
          import pathlib,re
          lines=pathlib.Path('/tmp/compiler-log.txt').read_text(errors='replace').splitlines()
          found=0
          for i,line in enumerate(lines):
              if 'e: file:' in line or ' error:' in line or 'What went wrong:' in line or 'Execution failed for task' in line:
                  text=re.sub(r'(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)', '[REDACTED]',line)
                  print('::error::'+text.replace('%','%25'))
                  found+=1
          print('Diagnostic lines: '+str(found))
          PY
