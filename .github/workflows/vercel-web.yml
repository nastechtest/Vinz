name: Vinz web checks and deployment gate

on:
  pull_request:
    paths: ["web/**", ".github/workflows/vercel-web.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/vercel-web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install and build
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_VINZ_API_URL: ${{ vars.NEXT_PUBLIC_VINZ_API_URL }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
