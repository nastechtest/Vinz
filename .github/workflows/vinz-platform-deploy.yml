name: Vinz platform deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        type: choice
        options: [staging, production]
      confirm_production:
        description: Type deploy-production when target is production
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "platform/cloudflare/**"
      - "supabase/functions/**"
      - "web/**"
      - ".github/workflows/vinz-platform-deploy.yml"

permissions:
  contents: read

concurrency:
  group: vinz-platform-deploy-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/cloudflare/package.json
      - name: Test API and validate deployment configs
        working-directory: platform/cloudflare
        run: |
          set -euo pipefail
          node --check vinz-api.js
          npm test
          node -e "for (const f of ['wrangler.jsonc','wrangler.production.jsonc']) { const c=JSON.parse(require('fs').readFileSync(f,'utf8')); if(c.main!=='vinz-api.js'||!c.r2_buckets?.length||!c.kv_namespaces?.length) process.exit(1); console.log(f, c.name, 'valid'); }"
      - name: Build Vercel web application
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

  deploy-worker:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Enforce production confirmation
        if: inputs.target == 'production'
        run: |
          test "${{ inputs.confirm_production }}" = "deploy-production" || {
            echo "Production deployment requires confirm_production=deploy-production"; exit 1;
          }
      - name: Deploy Worker with Wrangler
        working-directory: platform/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$POSTHOG_PROJECT_KEY"
          if [ "${{ inputs.target }}" = "production" ]; then
            CONFIG=wrangler.production.jsonc
            WORKER=vinz
          else
            CONFIG=wrangler.jsonc
            WORKER=vinz-api-staging
          fi
          npx --yes wrangler@4 deploy --config "$CONFIG"
          printf '%s' "$POSTHOG_PROJECT_KEY" | npx --yes wrangler@4 secret put POSTHOG_PROJECT_KEY --name "$WORKER" --config "$CONFIG"
          echo "Deployed $WORKER. No Supabase migrations or production auth redirect settings were changed."

  smoke-test:
    needs: deploy-worker
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify deployed API health
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then URL="https://vinz.nastechresearch.workers.dev"
          else URL="https://vinz-api-staging.nastechresearch.workers.dev"; fi
          curl --fail --silent --show-error "$URL/health" -o health.json
          node -e "const x=require('./health.json'); if(x.service!=='vinz-api'||x.status!=='ok'||x.configured!==true||x.backup_storage!==true) { console.error(x); process.exit(1); } console.log('API health and Supabase/R2 configuration verified');"
